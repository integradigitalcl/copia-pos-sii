version: "3.8"

services:
  seq:
    image: datalust/seq:2024.3
    container_name: grunflex-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: grunflex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  seq-data:
